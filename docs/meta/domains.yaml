version: 1
description: Domain profiles for MLTheory retrieval pruning and graph filtering.
default_domain: learning

domain_titles:
  learning: Learning
  probability: Probability
  statistics: Statistics
  optimization: Optimization
  rl: ReinforcementLearning
  bandits: Bandits
  ai: AIApplications
  llm: LLM

domain_descriptions:
  learning: Statistical learning theory and model selection modules.
  probability: Probability foundations and inequalities.
  statistics: Risk and information statistics modules.
  optimization: Online convex optimization and operations research modules.
  rl: Reinforcement learning and dynamic programming modules.
  bandits: Stochastic and adversarial bandit modules.
  ai: AI application bridges over learning and RL.
  llm: LLM application modules.

