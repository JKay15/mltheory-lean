version: 2
description: Two-axis v2 applied taxonomy for MLTheory research areas.
default_tag: learning_theory

tag_titles:
  learning_theory: LearningTheory
  statistics: Statistics
  optimization: Optimization
  online_learning: OnlineLearning
  bandits: Bandits
  reinforcement_learning: ReinforcementLearning
  information_theory: InformationTheory
  control: Control
  ai_applications: AIApplications
  llm: LLM

tag_descriptions:
  learning_theory: Generalization, capacity, and core SLT reasoning.
  statistics: Estimation, risk, and uncertainty quantification.
  optimization: Convex/non-convex optimization and search procedures.
  online_learning: Sequential and regret-minimization workflows.
  bandits: Exploration-exploitation and bandit feedback.
  reinforcement_learning: MDP and temporal-difference style methods.
  information_theory: Information metrics and coding-style bounds.
  control: Decision/control loops coupled with learning.
  ai_applications: Application-facing AI abstractions.
  llm: LLM-specific modeling and alignment workflows.

