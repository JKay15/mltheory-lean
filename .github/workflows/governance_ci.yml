name: MLTheory Governance Checks (Non-blocking)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  governance_checks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate SSOT contract
        run: python3 tools/docs/validate_ssot.py

      - name: Check derived docs sync
        run: python3 tools/docs/sync_docs.py --check

      - name: Check SSOT migration idempotence
        run: tools/ci/check_ssot_migration_idempotent.sh

      - name: Phase0 lean4 contract audit
        run: python3 tools/ci/audit_lean4_contract.py

      - name: Check namespace layout convergence
        run: python3 tools/ci/check_namespace_layout.py

      - name: Check deprecated import gate
        run: tools/ci/check_no_new_deprecated_imports.sh

      - name: Check cleanup ready-to-remove gate
        run: python3 tools/ci/check_ready_to_remove.py

      - name: Check placeholder policy (SSOT metadata)
        run: python3 tools/ci/check_placeholder_policy_ssot.py

      - name: Check SSOT reference hygiene
        run: python3 tools/ci/check_registry_reference_hygiene.py

      - name: Check canonical contract
        run: tools/ci/check_canonical_contract.sh

      - name: Check official workflow alignment
        run: tools/ci/check_official_workflow_alignment.sh

      - name: Check tool forest consistency
        run: python3 tools/ci/check_tool_forest_consistency.py

      - name: Check review views consistency
        run: python3 tools/ci/check_review_views_consistency.py

      - name: Generate MLTheory index artifacts (non-blocking)
        run: tools/index/gen_mltheory_index.sh

      - name: Generate graph/usage artifacts (non-blocking)
        run: tools/index/gen_graph_artifacts.sh

      - name: Validate meta/index/graph contracts
        run: python3 tools/ci/check_meta_index_graph_contract.py

      - name: Check generated artifacts are in sync
        run: tools/ci/check_generated_artifacts.sh
