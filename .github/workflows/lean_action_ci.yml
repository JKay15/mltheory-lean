name: MLTheory CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Lean toolchain
        uses: leanprover/lean-action@v1

      - name: Build
        run: ~/.elan/bin/lake build

      - name: Import smoke (layered + legacy)
        run: ~/.elan/bin/lake env lean Eval/ImportSmoke.lean

      - name: Canonical API smoke
        run: ~/.elan/bin/lake env lean Eval/CanonicalAPISmoke.lean

      - name: Check forbidden sorry/axiom
        run: tools/ci/check_no_sorry_axiom.sh

      - name: Check placeholder policy
        run: tools/ci/check_placeholder_policy.sh

      - name: Check layer boundary imports
        run: tools/ci/check_layer_imports.sh

      - name: Validate meta/index/graph contracts
        run: python3 tools/ci/check_meta_index_graph_contract.py

      - name: Check Graph UI mirror sync
        run: tools/ci/check_graph_ui_sync.sh

      - name: Check Graph UI source sync
        run: tools/ci/check_graph_ui_source_sync.sh
