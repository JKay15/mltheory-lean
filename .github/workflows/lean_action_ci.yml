name: MLTheory CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate SSOT contract
        run: python3 tools/docs/validate_ssot.py

      - name: Check derived docs sync
        run: python3 tools/docs/sync_docs.py --check

      - name: Setup Lean toolchain
        uses: leanprover/lean-action@v1

      - name: Build
        run: ~/.elan/bin/lake build

      - name: Import smoke (layered + legacy)
        run: ~/.elan/bin/lake env lean Eval/ImportSmoke.lean

      - name: Check forbidden sorry/axiom
        run: tools/ci/check_no_sorry_axiom.sh

      - name: Check placeholder policy
        run: tools/ci/check_placeholder_policy.sh
